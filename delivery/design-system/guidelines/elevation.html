<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px 18px;font-family:var(--font-ui);color:var(--text-body);background:var(--white);line-height:var(--lh-body);letter-spacing:var(--ls-body)}
.msym{font-family:'Material Symbols Rounded';display:inline-block;line-height:1.35}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:40px;border-radius:var(--r-md);border:1px solid var(--border-structure)}
.n{font-size:10.7px;font-weight:800;margin-top:6px;white-space:nowrap}
.v{font-family:var(--font-mono);font-size:10px;color:var(--text-meta);white-space:nowrap}
.lbl{font-size:10.7px;font-weight:800;color:var(--text-meta);letter-spacing:.05em;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
td{padding:6px 0;vertical-align:baseline}

</style></head><body><div class="g" style="gap:16px;align-items:flex-start;padding:6px 0 14px">
<div style="width:150px;height:66px;background:#fff;border:1px solid var(--border-structure);border-radius:var(--r-2xl);box-shadow:var(--shadow-dropdown);display:flex;align-items:center;justify-content:center;font-size:11.6px;font-weight:700">드롭다운</div>
<div style="width:150px;height:66px;background:#fff;border:1px solid var(--border-structure);border-radius:var(--r-3xl);box-shadow:var(--shadow-modal);display:flex;align-items:center;justify-content:center;font-size:11.6px;font-weight:700">모달</div>
<div style="width:150px;height:66px;background:#fff;border-left:1px solid var(--border-structure);box-shadow:var(--shadow-sheet);display:flex;align-items:center;justify-content:center;font-size:11.6px;font-weight:700">시트</div>
<div style="width:110px;height:66px;background:#fff;border:1px solid var(--border-structure);display:flex;align-items:center;justify-content:center;font-size:11.6px;font-weight:700;color:var(--text-sub)">본문 = 라인</div>
</div>
<div class="v">그림자는 4종뿐 — dropdown / modal / sheet / handle. 콘텐츠 카드에는 그림자를 쓰지 않는다.</div></body></html>
