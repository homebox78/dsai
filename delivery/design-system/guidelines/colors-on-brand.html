<!-- @dsCard group="Colors" viewport="700x120" subtitle="딥블루 헤더 위 컨트롤 채움·보더" name="On-brand surfaces" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px 18px;font-family:var(--font-ui);color:var(--text-body);background:var(--white);line-height:var(--lh-body);letter-spacing:var(--ls-body)}
.msym{font-family:'Material Symbols Rounded';display:inline-block;line-height:1.35}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:40px;border-radius:var(--r-md);border:1px solid var(--border-structure)}
.n{font-size:10.7px;font-weight:800;margin-top:6px;white-space:nowrap}
.v{font-family:var(--font-mono);font-size:10px;color:var(--text-meta);white-space:nowrap}
.lbl{font-size:10.7px;font-weight:800;color:var(--text-meta);letter-spacing:.05em;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
td{padding:6px 0;vertical-align:baseline}

</style></head><body><div style="background:var(--surface-brand);padding:12px;border-radius:var(--r-xl);display:flex;align-items:center;gap:8px">
<span style="display:flex;align-items:center;gap:6px;background:var(--on-brand-fill);border:1px solid var(--on-brand-border);border-radius:var(--r-lg);padding:6px 10px;color:#fff;font-size:12.6px">on-brand fill</span>
<span style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--on-brand-fill);border:1px solid var(--on-brand-border);border-radius:var(--r-md);color:#fff"><span class="msym" style="font-size:18px">settings</span></span>
<span style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:#fff;border-radius:var(--r-md);color:var(--blue-700)"><span class="msym" style="font-size:18px">auto_awesome</span></span>
<span style="color:var(--on-brand-text-soft);font-size:12.1px">rgba(255,255,255,.75) 보조 텍스트</span>
</div>
<div class="v" style="margin-top:10px">--on-brand-fill .10 · hover .20 · border .24 — 헤더 위에서는 흰색 알파만 사용, 슬레이트 톤 금지</div></body></html>
