<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px 18px;font-family:var(--font-ui);color:var(--text-body);background:var(--white);line-height:var(--lh-body);letter-spacing:var(--ls-body)}
.msym{font-family:'Material Symbols Rounded';display:inline-block;line-height:1.35}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:40px;border-radius:var(--r-md);border:1px solid var(--border-structure)}
.n{font-size:10.7px;font-weight:800;margin-top:6px;white-space:nowrap}
.v{font-family:var(--font-mono);font-size:10px;color:var(--text-meta);white-space:nowrap}
.lbl{font-size:10.7px;font-weight:800;color:var(--text-meta);letter-spacing:.05em;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
td{padding:6px 0;vertical-align:baseline}

</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;border:1px solid var(--border-structure);border-radius:var(--r-2xl);overflow:hidden">
  <div style="height:44px;display:flex;align-items:center;gap:7px;padding:0 18px;border-bottom:1px solid var(--border-structure);font-size:12.1px;font-weight:800"><span class="msym" style="font-size:17px;color:var(--text-meta)">check_circle</span>권장 — 라인 구분</div>
  <div style="padding:11px 18px;border-bottom:1px solid var(--border-hairline);font-size:12.6px">행 1</div><div style="padding:11px 18px;border-bottom:1px solid var(--border-hairline);font-size:12.6px">행 2</div>
</div>
<div style="flex:1;background:var(--slate-50);border:1px solid var(--border-structure);border-radius:var(--r-2xl);padding:12px">
  <div style="font-size:12.1px;font-weight:800;color:var(--state-alert-fg);margin-bottom:10px">지양 — 카드 중첩</div>
  <div style="background:#fff;border:1px solid var(--border-structure);border-radius:8px;box-shadow:0 2px 6px rgba(15,23,42,.08);padding:10px;margin-bottom:8px;font-size:12.6px">카드 1</div><div style="background:#fff;border:1px solid var(--border-structure);border-radius:8px;box-shadow:0 2px 6px rgba(15,23,42,.08);padding:10px;margin-bottom:8px;font-size:12.6px">카드 2</div>
</div>
</div></body></html>
