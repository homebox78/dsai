<!-- @dsCard group="Brand" viewport="700x150" subtitle="hover · selected · focus · disabled" name="Interaction states" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px 18px;font-family:var(--font-ui);color:var(--text-body);background:var(--white);line-height:var(--lh-body);letter-spacing:var(--ls-body)}
.msym{font-family:'Material Symbols Rounded';display:inline-block;line-height:1.35}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:40px;border-radius:var(--r-md);border:1px solid var(--border-structure)}
.n{font-size:10.7px;font-weight:800;margin-top:6px;white-space:nowrap}
.v{font-family:var(--font-mono);font-size:10px;color:var(--text-meta);white-space:nowrap}
.lbl{font-size:10.7px;font-weight:800;color:var(--text-meta);letter-spacing:.05em;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
td{padding:6px 0;vertical-align:baseline}

</style></head><body><div style="border:1px solid var(--border-structure);border-radius:var(--r-2xl);overflow:hidden;margin-bottom:12px">
<div style="display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border-hairline);font-size:12.6px">기본 · #fff</div>
<div style="display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border-hairline);background:var(--surface-row-hover);font-size:12.6px">hover · slate-100</div>
<div style="display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--surface-selected);border-left:2px solid var(--border-brand);font-size:12.6px;font-weight:700;color:var(--text-accent)">selected · blue-50 + 2px 블루 라인</div>
</div>
<div class="g" style="align-items:center">
<input value="포커스" style="border:1px solid var(--focus-border);border-radius:var(--r-md);padding:9px 11px;font-family:inherit;font-size:13.6px;box-shadow:var(--focus-ring);outline:none">
<button style="background:var(--surface-brand);color:#fff;border:none;border-radius:var(--r-lg);padding:9px 14px;font-family:inherit;font-size:12.6px;font-weight:700;opacity:.45">disabled · opacity .45</button>
<span class="v">누름 상태는 색 변화만 — 스케일·바운스 없음</span>
</div></body></html>
