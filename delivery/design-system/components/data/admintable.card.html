<!-- @dsCard group="Components" viewport="720x270" subtitle="AdminTable — 채널·조직&사업부·권한 그룹" name="Admin table" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AdminTable</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-body);background:#fff;line-height:var(--lh-body);letter-spacing:var(--ls-body)}
  *{box-sizing:border-box}
  .msym{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;display:inline-block;flex:none}
  .tb{background:#fff;border:1px solid var(--border-structure);border-radius:var(--r-2xl);overflow-x:auto}
  .gr{display:grid;grid-template-columns:minmax(180px,1fr) 108px 96px 96px 84px;gap:8px;min-width:660px;align-items:center}
  .hd{padding:9px 14px;border-bottom:1px solid var(--border-structure);font-size:11.2px;font-weight:800;color:var(--text-meta)}
  .hd span{white-space:nowrap;text-align:center}.hd span:first-child{text-align:left}
  .rw{padding:11px 18px;border-bottom:1px solid var(--border-hairline)}
  .rw:last-child{border-bottom:none}
  .nm{display:flex;align-items:center;gap:8px;min-width:0}
  .tl{flex:none;width:26px;height:26px;border-radius:7px;background:var(--blue-50);border:1px solid var(--border-tint);display:flex;align-items:center;justify-content:center}
  .n1{display:block;font-size:13.6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n2{display:block;font-size:11.2px;color:var(--text-meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc{font-size:12.1px;color:var(--text-sub);white-space:nowrap;text-align:center}
  .bd{font-size:10.7px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .ce{display:flex;justify-content:center}
  .act{background:#fff;border:1px solid var(--border-control);border-radius:5px;padding:5px 10px;font-size:11.2px;font-weight:700;color:var(--text-label);white-space:nowrap}</style></head><body>
<div class="tb">
  <div class="gr hd"><span>채널</span><span>유형</span><span>참여자</span><span>공개 범위</span><span></span></div>
  <div class="gr rw">
    <span class="nm"><span class="tl"><span class="msym" style="font-size:16px;color:var(--blue-900)">forum</span></span><span style="min-width:0"><span class="n1">ESG 전략 TF</span><span class="n2">최근 활동 10:42</span></span></span>
    <span class="cc">그룹</span><span class="cc">5명</span>
    <span class="ce"><span class="bd" style="background:var(--blue-50);color:var(--blue-900)">공개</span></span>
    <span class="ce"><button class="act">관리</button></span>
  </div><div class="gr rw">
    <span class="nm"><span class="tl"><span class="msym" style="font-size:16px;color:var(--blue-900)">forum</span></span><span style="min-width:0"><span class="n1">법무 검토 채널</span><span class="n2">최근 활동 07.22</span></span></span>
    <span class="cc">그룹</span><span class="cc">4명</span>
    <span class="ce"><span class="bd" style="background:var(--slate-100);color:var(--slate-500)">비공개</span></span>
    <span class="ce"><button class="act">관리</button></span>
  </div><div class="gr rw">
    <span class="nm"><span class="tl"><span class="msym" style="font-size:16px;color:var(--blue-900)">campaign</span></span><span style="min-width:0"><span class="n1">전체 공지</span><span class="n2">프로젝트 기본 채널</span></span></span>
    <span class="cc">공지</span><span class="cc">24명</span>
    <span class="ce"><span class="bd" style="background:var(--blue-50);color:var(--blue-900)">공개</span></span>
    <span class="ce"><button class="act">관리</button></span>
  </div><div class="gr rw">
    <span class="nm"><span class="tl"><span class="msym" style="font-size:16px;color:var(--blue-900)">chat</span></span><span style="min-width:0"><span class="n1">김대성</span><span class="n2">1:1 대화</span></span></span>
    <span class="cc">1:1</span><span class="cc">2명</span>
    <span class="ce"><span class="bd" style="background:var(--slate-100);color:var(--slate-500)">비공개</span></span>
    <span class="ce"><button class="act">관리</button></span>
  </div><div class="gr rw">
    <span class="nm"><span class="tl"><span class="msym" style="font-size:16px;color:var(--blue-900)">group_add</span></span><span style="min-width:0"><span class="n1">외부 감사 협업</span><span class="n2">외부 협업자 포함</span></span></span>
    <span class="cc">게스트</span><span class="cc">3명</span>
    <span class="ce"><span class="bd" style="background:var(--orange-50);color:var(--orange-700)">제한</span></span>
    <span class="ce"><button class="act">관리</button></span>
  </div>
</div>
</body></html>
