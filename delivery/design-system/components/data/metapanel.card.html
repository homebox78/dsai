<!-- @dsCard group="Components" viewport="480x400" subtitle="MetaPanel — 파일 메타데이터 정의 목록" name="Meta panel" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>MetaPanel</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:16px;font-family:var(--font-ui);color:var(--text-body);background:#fff;line-height:var(--lh-body);letter-spacing:var(--ls-body);width:480px}
  *{box-sizing:border-box}
  .mp{border:1px solid var(--border-structure);border-radius:var(--r-2xl);overflow:hidden}
  .mr{display:flex;gap:11px;align-items:baseline;padding:11px 18px;border-bottom:1px solid var(--border-hairline)}
  .mr:last-child{border-bottom:none}
  .ml{width:96px;flex:none;font-size:11.6px;font-weight:700;color:var(--text-sub)}
  .mv{flex:1;min-width:0;font-size:12.6px;font-weight:500;line-height:1.7;word-break:break-word}
  .act{flex:none;background:none;border:none;padding:0;font-size:10.7px;font-weight:700;color:var(--text-link)}</style></head><body>
<div class="mp">
<div class="mr"><span class="ml">파일명</span><span class="mv" style="color:var(--text-body);font-weight:500">표준 공급계약서_v3.docx</span></div><div class="mr"><span class="ml">위치</span><span class="mv" style="color:var(--text-body);font-weight:500">문서 저장소 / 계약·법무</span><button class="act">이동</button></div><div class="mr"><span class="ml">형식 · 용량</span><span class="mv" style="color:var(--text-body);font-weight:500">DOCX · 1.2MB · 218페이지</span></div><div class="mr"><span class="ml">등록자 · 등록일</span><span class="mv" style="color:var(--text-body);font-weight:500">김대성 · 2026.07.21</span></div><div class="mr"><span class="ml">OCR 처리</span><span class="mv" style="color:var(--state-done-fg);font-weight:700">완료 · 텍스트 추출 218페이지</span></div><div class="mr"><span class="ml">RAG 색인</span><span class="mv" style="color:var(--state-done-fg);font-weight:700">완료 · 청크 654개 · 추론 검색 가능</span></div><div class="mr"><span class="ml">보존 기한</span><span class="mv" style="color:var(--text-body);font-weight:500">2031.12.31 (5년 보존)</span></div><div class="mr"><span class="ml">접근 권한</span><span class="mv" style="color:var(--text-body);font-weight:500">프로젝트 멤버 6명 · 외부 공유 없음</span></div><div class="mr"><span class="ml">인용 현황</span><span class="mv" style="color:var(--text-accent);font-weight:700">에코바디스 답변 3건에서 근거로 사용</span><button class="act">보기</button></div>
</div>
</body></html>
