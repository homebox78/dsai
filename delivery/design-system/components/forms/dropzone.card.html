<!-- @dsCard group="Components" viewport="700x240" subtitle="DropZone — 파일 업로드 드롭존" name="Drop zone" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>DropZone</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:18px;font-family:var(--font-ui);color:var(--text-body);background:#fff;line-height:var(--lh-body);letter-spacing:var(--ls-body)}
  *{box-sizing:border-box}
  .msym{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;display:inline-block;flex:none}
  .dz{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px dashed var(--border-control);background:var(--surface-canvas);border-radius:var(--r-2xl);padding:22px 16px;margin-bottom:16px}
  .dz.hov{border-color:var(--focus-border);background:var(--surface-selected)}
  .dz.cmp{padding:10px 16px;background:transparent}
  .t{font-size:13.6px;font-weight:700;color:var(--text-label);text-align:center}
  .h{font-size:11.2px;color:var(--text-meta);text-align:center}</style></head><body>
<div class="dz hov">
  <span class="msym" style="font-size:27.6px;color:var(--blue-700)">upload</span>
  <span class="t">파일을 끌어다 놓거나 클릭해서 선택</span>
  <span class="h">PDF, DOCX, XLSX, HWP, 이미지 · 1건당 100MB까지</span>
</div>
<div class="dz">
  <span class="msym" style="font-size:27.6px;color:var(--blue-700)">upload</span>
  <span class="t">파일을 끌어다 놓거나 클릭해서 선택</span>
  <span class="h">PDF, DOCX, XLSX, HWP, 이미지 · 1건당 100MB까지</span>
</div>
<div class="dz cmp">
  <span class="msym" style="font-size:20px;color:var(--blue-700)">attach_file</span>
  <span class="t" style="font-size:12.1px">처리 파일 첨부</span>
</div>
</body></html>
